<section id="servicios" class="section">
  <header>
    <p class="eyebrow">{{ servicesEyebrow() }}</p>
    <h2>{{ servicesHeading() }}</h2>
  </header>
  <div class="card-grid">
    <article class="card">
      <h3>{{ card1Title() }}</h3>
      <p>{{ card1Body() }}</p>
    </article>
    <article class="card">
      <h3>{{ card2Title() }}</h3>
      <p>{{ card2Body() }}</p>
    </article>
    <article class="card">
      <h3>{{ card3Title() }}</h3>
      <p>{{ card3Body() }}</p>
    </article>
  </div>
  <button type="button" class="primary-button" (click)="onButtonClick()">
    {{ buttonLabel() }}
  </button>
</section>
