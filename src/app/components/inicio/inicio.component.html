<section id="inicio" class="section hero">
  <div class="hero-text">
    <p class="eyebrow">{{ eyebrow() }}</p>
    <h1>{{ heading() }}</h1>
    <p>{{ description() }}</p>
    <div class="hero-actions">
      <button class="primary">{{ primaryCtaLabel() }}</button>
      <button class="ghost">{{ secondaryCtaLabel() }}</button>
    </div>
  </div>
  <div class="hero-card">
    <h3>{{ summaryTitle() }}</h3>
    <ul>
      <li>{{ summaryItem1() }}</li>
      <li>{{ summaryItem2() }}</li>
      <li>{{ summaryItem3() }}</li>
    </ul>
  </div>
</section>
