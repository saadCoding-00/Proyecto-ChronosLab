<section id="contacto" class="section contact">
  <header>
    <p class="eyebrow">{{ data().eyebrow }}</p>
    <h2>{{ data().heading }}</h2>
  </header>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      {{ data().labels.name }}
      <input type="text" formControlName="name" [placeholder]="data().placeholders.name" />
      <span class="error" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">
        {{ data().errors.name }}
      </span>
    </label>

    <label>
      {{ data().labels.email }}
      <input type="email" formControlName="email" [placeholder]="data().placeholders.email" />
      <span class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
        {{ data().errors.email }}
      </span>
    </label>

    <label>
      {{ data().labels.message }}
      <textarea rows="4" formControlName="message" [placeholder]="data().placeholders.message"></textarea>
      <span class="error" *ngIf="form.get('message')?.touched && form.get('message')?.invalid">
        {{ data().errors.message }}
      </span>
    </label>

    <button type="submit" class="primary">{{ data().labels.submit }}</button>
    <p class="success" *ngIf="submitted">
      {{ data().successMessage }}
    </p>
  </form>
</section>
