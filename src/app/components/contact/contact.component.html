<section id="contacto" class="section contact">
  <header>
    <p class="eyebrow">{{ eyebrow() }}</p>
    <h2>{{ heading() }}</h2>
  </header>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      {{ nameLabel() }}
      <input type="text" formControlName="name" [placeholder]="namePlaceholder()" />
      <span class="error" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">
        {{ nameError() }}
      </span>
    </label>

    <label>
      {{ emailLabel() }}
      <input type="email" formControlName="email" [placeholder]="emailPlaceholder()" />
      <span class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
        {{ emailError() }}
      </span>
    </label>

    <label>
      {{ messageLabel() }}
      <textarea rows="4" formControlName="message" [placeholder]="messagePlaceholder()"></textarea>
      <span class="error" *ngIf="form.get('message')?.touched && form.get('message')?.invalid">
        {{ messageError() }}
      </span>
    </label>

    <button type="submit" class="primary">{{ submitLabel() }}</button>
    <p class="success" *ngIf="submitted">
      {{ successMessage() }}
    </p>
  </form>
</section>
