<section id="contacto" class="section contact">
  <header>
    <p class="eyebrow">Contacto</p>
    <h2>Conversemos sobre tu necesidad de análisis o investigación.</h2>
  </header>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Nombre
      <input type="text" formControlName="name" placeholder="Nombre completo" />
      <span class="error" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">
        Indica tu nombre (mínimo 2 caracteres).
      </span>
    </label>

    <label>
      Email
      <input type="email" formControlName="email" placeholder="nombre@institucion.edu" />
      <span class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
        Indica un email válido.
      </span>
    </label>

    <label>
      Mensaje
      <textarea rows="4" formControlName="message" placeholder="Describe el objetivo del estudio"></textarea>
      <span class="error" *ngIf="form.get('message')?.touched && form.get('message')?.invalid">
        Describe con más detalle (mínimo 10 caracteres).
      </span>
    </label>

    <button type="submit" class="primary">Enviar</button>
  </form>
</section>
