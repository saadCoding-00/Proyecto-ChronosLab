<section id="informes" class="section reports">
  <header>
    <p class="eyebrow">Informes</p>
    <h2>Consulta informes técnicos disponibles para descarga o lectura en línea.</h2>
  </header>

  <div class="report-list">
    <article class="report-card" *ngFor="let report of reports">
      <div>
        <h3>{{ report.title }}</h3>
        <p>{{ report.description }}</p>
      </div>
      <div class="report-actions">
        <a class="ghost" [href]="getReportUrl(report.fileName)" target="_blank" rel="noopener">
          Abrir PDF
        </a>
        <a class="primary" [href]="getReportUrl(report.fileName)" [download]="report.fileName">
          Descargar
        </a>
      </div>
    </article>
  </div>
</section>
