<section id="evaluador" class="time-evaluator">
  <div class="section-header">
    <p class="section-kicker">{{ sectionKicker() }}</p>
    <h2>{{ heading() }}</h2>
    <p>{{ description() }}</p>
  </div>

  <form [formGroup]="form" class="evaluator-form">
    <div class="form-grid">
      <label class="form-field">
        <span>{{ nameLabel() }}</span>
        <input type="text" formControlName="name" [placeholder]="namePlaceholder()" />
      </label>
      <label class="form-field">
        <span>{{ lastNameLabel() }}</span>
        <input type="text" formControlName="lastName" [placeholder]="lastNamePlaceholder()" />
      </label>
      <label class="form-field">
        <span>{{ ageLabel() }}</span>
        <input type="number" min="0" max="120" formControlName="age" [placeholder]="agePlaceholder()" />
      </label>
    </div>

    <label class="form-field full-width">
      <span>{{ notesLabel() }}</span>
      <textarea rows="3" formControlName="notes" [placeholder]="notesPlaceholder()"></textarea>
    </label>

    <label class="form-field">
      <span>{{ profileLabel() }}</span>
      <select formControlName="profile">
        <option value="estudiante">{{ optionEstudianteLabel() }}</option>
        <option value="teletrabajador">{{ optionTeletrabajadorLabel() }}</option>
        <option value="gamer">{{ optionGamerLabel() }}</option>
      </select>
    </label>

    <div class="form-grid">
      <label class="form-field">
        <span>{{ studyHoursLabel() }}</span>
        <input type="number" min="0" max="24" step="0.5" formControlName="studyHours" />
      </label>
      <label class="form-field">
        <span>{{ workHoursLabel() }}</span>
        <input type="number" min="0" max="24" step="0.5" formControlName="workHours" />
      </label>
      <label class="form-field">
        <span>{{ gamingHoursLabel() }}</span>
        <input type="number" min="0" max="24" step="0.5" formControlName="gamingHours" />
      </label>
      <label class="form-field">
        <span>{{ socialHoursLabel() }}</span>
        <input type="number" min="0" max="24" step="0.5" formControlName="socialHours" />
      </label>
    </div>
  </form>

  <div class="results">
    <div class="results-summary">
      <h3>{{ resultTitle() }}</h3>
      <p class="result-value">{{ productivePercent }}% {{ productiveLabel() }}</p>
      <p class="result-detail">
        {{ productiveHoursLabel() }}: {{ productiveHours }} / {{ totalHours }} {{ hoursLabel() }}
      </p>
    </div>

    <div class="progress-wrapper">
      <div class="progress-track">
        <div [class]="progressClass" [style.width.%]="productivePercent"></div>
      </div>
      <div class="progress-labels">
        <span>0%</span>
        <span>100%</span>
      </div>
    </div>

    <div class="result-message">
      <h4>{{ recommendationTitle() }}</h4>
      <p>{{ message }}</p>
    </div>
  </div>

  <button type="button" class="primary pdf-button" (click)="generatePdf()">
    {{ pdfButtonLabel() }}
  </button>
</section>
