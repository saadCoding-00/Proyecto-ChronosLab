      <p class="brand-name">{{ companyName }}</p>

    </div>
  </div>
  <nav class="site-nav">
    <a class="nav-link" routerLink="/inicio" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
